<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --muted: #666; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --muted: #aaa; --line: #444; } }
  body { font: 13px system-ui, sans-serif; width: 380px; margin: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; }
  label.opt { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  h4 { margin: 8px 0 6px; font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .item { padding: 8px 0; border-top: 1px solid var(--line); }
  .item input[type=text] { width: 100%; box-sizing: border-box; padding: 4px 6px; margin-bottom: 6px; font: inherit; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .meta { flex: 1; color: var(--muted); font-size: 11px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); }
  .notice { border: 1px solid #d97706; border-radius: 6px; padding: 8px; margin-bottom: 10px; }
  .notice p { margin: 0 0 6px; }
  button, select { cursor: pointer; font: inherit; }
</style>
<div class="brand"><img src="icons/48.png" width="28" height="28" alt=""><strong>Hoardini</strong></div>
<div id="access" class="notice" hidden>
  <p>Hoardini needs access to all sites to see the videos on a page and to send your sign-in cookies along with downloads.</p>
  <button id="grant">Allow access</button>
</div>
<label class="opt"><input type="checkbox" id="intercept"> Capture browser downloads</label>
<h4>Media on this page</h4>
<div id="list" class="empty">Looking…</div>
<datalist id="names"></datalist>
<script src="popup.js"></script>
