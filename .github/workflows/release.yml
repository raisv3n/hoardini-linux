name: Release

# Pushing a tag like v0.5.11 builds Hoardini, attaches the .deb, the tarball and (when the AMO secrets
# are set) the Mozilla-signed extension to a GitHub release with SHA-256 checksums, and records a
# signed build-provenance attestation for the files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    env:
      # Passed through the environment, never pasted into scripts, so a tag name can't inject commands.
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg dpkg-dev zip

      - name: Install Rust and cargo-deb
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-deb --locked --version 3.8.0

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked --workspace

      # Optional: with AMO API credentials as repository secrets, the release carries a signed extension
      # that Firefox installs for good. Needs a new version in extension/manifest.json for each upload.
      - name: Sign the Firefox extension
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        if: env.AMO_JWT_ISSUER != ''
        run: ./scripts/sign-xpi.sh

      - name: Build and package
        run: ./package.sh

      - name: Check the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Checksums
        run: |
          cd dist
          shopt -s nullglob
          sha256sum *.deb *.tar.gz hoardini.xp[i] > SHA256SUMS.txt  # [i]: dropped by nullglob when there is no signed extension
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz

      - name: Publish release
        run: |
          shopt -s nullglob
          gh release create "$TAG" dist/*.deb dist/*.tar.gz dist/hoardini.xp[i] dist/SHA256SUMS.txt --title "Hoardini $TAG" --generate-notes --verify-tag
