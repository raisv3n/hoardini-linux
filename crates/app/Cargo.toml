    ["../../extension/icons/16.png", "usr/share/hoardini/extension/icons/", "644"],
    ["../../extension/icons/32.png", "usr/share/hoardini/extension/icons/", "644"],
    ["../../extension/icons/48.png", "usr/share/hoardini/extension/icons/", "644"],
    ["../../extension/icons/128.png", "usr/share/hoardini/extension/icons/", "644"],
    ["../../README.md", "usr/share/doc/hoardini/", "644"],
